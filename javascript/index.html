<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1 id="main-heading">DOM Manipulation Demo</h1>
    </header>

    <main>
        <section class="content-section">
            <p id="dynamic-text">This text will change when you click the button below.</p>
            <button id="change-text-btn" class="action-btn">Change Text</button>
        </section>

        <section class="content-section">
            <div id="style-demo" class="box">This box will change style when clicked</div>
        </section>

        <section class="content-section">
            <button id="toggle-element-btn" class="action-btn">Toggle Element</button>
            <div id="toggle-container">
                <p id="toggled-element">This element can be toggled</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 DOM Manipulation Example</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
